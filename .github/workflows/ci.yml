name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend_app.py tests
      - name: Check formatting
        run: ruff format --check backend_app.py tests
      - name: Check browser JavaScript syntax
        run: |
          python scripts/extract_inline_js.py
          node --check /tmp/civicshield-inline.js
      - name: Run tests
        run: pytest -q
