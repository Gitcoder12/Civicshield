name: CivicShield V2 CI

on:
  push:
    branches:
      - v2-ultra-cooked
  pull_request:
    branches:
      - main
    paths:
      - "v2/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/civicshield-v2.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: civicshield-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} · lint, tests and compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check v2 tests

      - name: Ruff formatting
        run: ruff format --check v2 tests

      - name: Compile Python sources
        run: python -m compileall -q v2 tests

      - name: Run automated tests
        run: pytest -q
